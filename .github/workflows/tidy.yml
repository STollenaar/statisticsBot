name: Tidy GO modules Workflow

on:
  workflow_dispatch:

jobs:
  tidy-modules:
    name: Tidy Go Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          # Read straight from go.mod. The previous version of this wrote
          # GO_VERSION to $GITHUB_ENV but read it back as a step *output*, which
          # is always empty, so setup-go received no version at all and silently
          # used whatever Go the runner had preinstalled.
          go-version-file: go.mod

      - name: Tidy Go modules
        run: |
          find . -type d \( -name build -prune \) -o -name go.mod -print | while read -r gomod_path; do
            dir_path=$(dirname "$gomod_path")
            echo "Tidying Go modules in directory: $dir_path"
            (cd "$dir_path" && go mod tidy)
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: tidy Go modules"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: tidy-modules
          title: "Tidy Go Modules"
          body: "This PR runs 'go mod tidy' to clean up unused dependencies."
